[package]
name = "disbot"
version = "0.1.0"
authors = ["dfontana <dyfontana@gmail.com>"]
edition = "2021"

[dependencies]
anyhow = "~1.0"
async-trait = "~0.1"
axum = "~0.8"
base64 = "~0.23"
bincode = "~2.0"
bollard = "~0.21"
cached = { version = "~4.0", features = ["async"] }
chrono = { version = "~0.4", features = ["serde"] }
chrono-tz = { version = "~0.10", features = ["case-insensitive"] }
clap = { version = "~4.6", features = ["derive"] }
derive_more = { version = "~2.1", features = ["full"] }
derive-new = "~0.7"
hex = "~0.4"
humantime = "~2.4"
humantime-serde = "~1.1"
itertools = "~0.15"
kitchen-sink = { git = "https://github.com/dfontana/kitchen-sink.git", tag = "0.1" }
local-ip-address = "~0.6"
once_cell = "~1.21"
openssl = { version = "~0.10", features = ["vendored"] }
rand = "~0.10"
redb = "~4.4"
regex = "~1.13"
reqwest = { version = "~0.12", features = ["json"] }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
serenity = { default-features = false, features = [
  "client",
  "cache",
  "gateway",
  "model",
  "rustls_backend",
  "unstable_discord_api",
  "voice",
], version = "~0.12" }
songbird = { features = ["builtin-queue"], version = "~0.6" }
symphonia = { features = ["aac", "mp3", "isomp4", "alac"], version = "~0.5" }
tokio = { version = "~1.54", features = ["full"] }
tokio-util = "~0.7"
toml = "~1.1"
tower = "~0.5"
tower-http = { version = "~0.7", features = ["fs"] }
tracing = "~0.1"
tracing-error = "~0.2"
tracing-subscriber = "~0.3"

[dependencies.uuid]
version = "~1.29"
features = [
  "v4",                # Lets you generate random UUIDs
  "fast-rng",          # Use a faster (but still sufficiently random) RNG
  "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
  "serde",             # Enable serialization support
]

[dev-dependencies]
tempfile = "~3.27"
test-case = "~3.4"
